{% load static %}

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Issue Category Report</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link
    rel="stylesheet"
    href="{% static 'css/crm_dashboard.css' %}">


<!-- ========================================================= -->
<!-- ISSUE CATEGORY REPORT -->
<!-- ========================================================= -->

<div class="card shadow border-0">

    <div class="card-header bg-primary text-white">

        <div class="d-flex justify-content-between align-items-center">

            <h5 class="mb-0">

                <i class="fas fa-chart-bar me-2"></i>

                Issue Category Report

            </h5>

            <!-- BACK TO DASHBOARD -->

            <a href="{% url 'crm_dashboard' %}"
               class="btn btn-light btn-sm">

                <i class="fas fa-arrow-left me-1"></i>

                Back to Dashboard

            </a>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- CHART -->
    <!-- ===================================================== -->

    <div class="card-body">

        <div class="chart-container"
             style="position: relative; height: 450px;">

            <canvas id="issueChart"></canvas>

        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- CHART.JS -->
<!-- ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

const ctx = document.getElementById('issueChart');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: {{ issue_labels|safe }},

        datasets: [{

            label: 'Issue Count',

            data: {{ issue_counts|safe }},

            borderWidth: 1

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        scales: {

            y: {

                beginAtZero: true,

                ticks: {

                    stepSize: 1

                },

                title: {

                    display: true,

                    text: 'Number of Issues'

                }

            },

            x: {

                title: {

                    display: true,

                    text: 'Issue Category'

                }

            }

        },

        plugins: {

            legend: {

                display: true

            }

        }

    }

});

</script>
