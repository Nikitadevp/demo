{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Feedback</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="{% static 'css/customer_feedback.css' %}">

</head>


<body>


<div class="feedback-page">


    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <div class="feedback-header">

        <div class="header-icon">
            <i class="bi bi-chat-square-heart-fill"></i>
        </div>

        <div>
            <h1>Customer Feedback</h1>

            <p>
                Please update the details below
            </p>
        </div>

    </div>


    <!-- ===================================================== -->
    <!-- FORM CARD -->
    <!-- ===================================================== -->

    <div class="feedback-card">


        <form method="POST">

            {% csrf_token %}


            <!-- ================================================= -->
            <!-- PREFILLED DETAILS -->
            <!-- ================================================= -->

            <div class="section-title">

                <i class="bi bi-person-vcard"></i>

                <span>Customer Details</span>

            </div>


            <div class="form-grid">


                <!-- UID -->

                <div class="form-group">

                    <label>
                        UID
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        name="uid"
                        value="{{ customer.uid|default:'' }}"
                        readonly
                    >

                </div>


                <!-- CUSTOMER -->

                <div class="form-group">

                    <label>
                        Customer
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        name="customer"
                        value="{{ customer.customer_name|default:'' }}"
                        readonly
                    >

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label>
                        Contact
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        name="contact"
                        value="{{ customer.contact_number|default:'' }}"
                        readonly
                    >

                </div>


                <!-- BLOCK -->

                <div class="form-group">

                    <label>
                        Block
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        name="block"
                        value="{{ customer.block|default:'' }}"
                        readonly
                    >

                </div>


                <!-- FLAT / LOCATION -->

                <div class="form-group">

                    <label>
                        Flat/Location
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        name="flat"
                        value="{{ customer.flat|default:'' }}"
                        readonly
                    >

                </div>


                <!-- CASE ID -->

                <div class="form-group">

                    <label>
                        Case ID
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        name="case_id"
                        value="{{ customer.case_id|default:'' }}"
                        readonly
                    >

                </div>


            </div>


            <!-- ================================================= -->
            <!-- FEEDBACK SECTION -->
            <!-- ================================================= -->

            <div class="section-title feedback-title">

                <i class="bi bi-chat-left-text"></i>

                <span>Customer Feedback</span>

            </div>


            <!-- ================================================= -->
            <!-- ISSUE RESOLVED -->
            <!-- ================================================= -->

            <div class="question-box">

                <label class="question-label">

                    Issue Resolved ?

                    <span>*</span>

                </label>

                <p class="question-help">
                    Please select one option.
                </p>


                <div class="radio-group">


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="issue_resolved"
                            value="Yes"
                            required
                        >

                        <span class="radio-custom"></span>

                        <span>Yes</span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="issue_resolved"
                            value="No"
                            required
                        >

                        <span class="radio-custom"></span>

                        <span>No</span>

                    </label>


                </div>

            </div>


            <!-- ================================================= -->
            <!-- CUSTOMER REMARK -->
            <!-- ================================================= -->

            <div class="question-box">

                <label class="question-label">

                    Customer Remark

                    <span>*</span>

                </label>


                <textarea
                    name="customer_remark"
                    rows="5"
                    placeholder="Enter customer remark..."
                    required
                ></textarea>


            </div>


            <!-- ================================================= -->
            <!-- SERVICE SATISFIED -->
            <!-- ================================================= -->

            <div class="question-box">

                <label class="question-label">

                    Satisfied With Service ?

                    <span>*</span>

                </label>

                <p class="question-help">
                    Please select one option.
                </p>


                <div class="radio-group">


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="service_satisfied"
                            value="Yes"
                            required
                        >

                        <span class="radio-custom"></span>

                        <span>Yes</span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="service_satisfied"
                            value="No"
                            required
                        >

                        <span class="radio-custom"></span>

                        <span>No</span>

                    </label>


                </div>

            </div>


            <!-- ================================================= -->
            <!-- SUBMIT -->
            <!-- ================================================= -->

            <div class="form-footer">

                <button type="submit" class="submit-btn">

                    <i class="bi bi-check-circle"></i>

                    Submit Feedback

                </button>

            </div>


        </form>


    </div>


    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <div class="page-footer">

        <i class="bi bi-shield-check"></i>

        Thank you for your valuable feedback.

    </div>


</div>


</body>

</html>
