{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Feedback</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{% static 'css/customer_feedback.css' %}">

</head>


<body>

<div class="feedback-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="feedback-header">

        <div class="header-icon">
            <i class="bi bi-chat-square-heart"></i>
        </div>

        <div>
            <h1>Customer Feedback</h1>

            <p>
                Please update below details
            </p>
        </div>

    </div>


    <!-- =====================================================
         FORM CARD
    ====================================================== -->

    <div class="feedback-card">

        <form method="POST">

            {% csrf_token %}


            <!-- =================================================
                 PREFILLED CUSTOMER DETAILS
            ================================================== -->

            <div class="section-title">

                <i class="bi bi-person-vcard"></i>

                <span>Customer Details</span>

            </div>


            <div class="form-grid">


                <!-- UID -->

                <div class="form-group">

                    <label>
                        UID <span>*</span>
                    </label>

                    <input
                        type="text"
                        value="{{ customer.id }}"
                        readonly
                    >

                </div>


                <!-- CUSTOMER -->

                <div class="form-group">

                    <label>
                        Customer <span>*</span>
                    </label>

                    <input
                        type="text"
                        value="{{ customer.name }}"
                        readonly
                    >

                </div>


                <!-- CONTACT -->

                <div class="form-group">

                    <label>
                        Contact <span>*</span>
                    </label>

                    <input
                        type="text"
                        value="{{ customer.contact }}"
                        readonly
                    >

                </div>


                <!-- BLOCK -->

                <div class="form-group">

                    <label>
                        Block <span>*</span>
                    </label>

                    <input
                        type="text"
                        value="{{ customer.tower }}"
                        readonly
                    >

                </div>


                <!-- FLAT / LOCATION -->

                <div class="form-group">

                    <label>
                        Flat/Location <span>*</span>
                    </label>

                    <input
                        type="text"
                        value="{{ customer.area }}"
                        readonly
                    >

                </div>


                <!-- CASE ID -->

                <div class="form-group">

                    <label>
                        Caseid <span>*</span>
                    </label>

                    <input
                        type="text"
                        value="{{ customer.ticket_id }}"
                        readonly
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ customer.email }}"
                        readonly
                    >

                </div>

            </div>


            <!-- =================================================
                 FEEDBACK SECTION
            ================================================== -->

            <div class="section-title feedback-title">

                <i class="bi bi-chat-square-text"></i>

                <span>Customer Feedback</span>

            </div>


            <!-- =================================================
                 ISSUE RESOLVED
            ================================================== -->

            <div class="question-box">

                <label class="question-label">

                    Issue Resolved ? <span>*</span>

                </label>

                <p class="question-help">
                    Mark only one option.
                </p>


                <div class="radio-group">


                    <!-- YES -->

                    <label class="radio-option">

                        <input
                            type="radio"
                            name="issue_resolved"
                            value="Yes"
                            required
                        >

                        <span class="radio-custom"></span>

                        <span>Yes</span>

                    </label>


                    <!-- NO -->

                    <label class="radio-option">

                        <input
                            type="radio"
                            name="issue_resolved"
                            value="No"
                        >

                        <span class="radio-custom"></span>

                        <span>No</span>

                    </label>


                </div>

            </div>


            <!-- =================================================
                 CUSTOMER REMARK
            ================================================== -->

            <div class="question-box">

                <label class="question-label">

                    Customer Remark <span>*</span>

                </label>


                <textarea
                    name="customer_remark"
                    placeholder="Enter customer remark..."
                    required
                ></textarea>

            </div>


            <!-- =================================================
                 SATISFIED WITH SERVICE
            ================================================== -->

            <div class="question-box">

                <label class="question-label">

                    Satisfied With Service ? <span>*</span>

                </label>

                <p class="question-help">
                    Mark only one option.
                </p>


                <div class="radio-group">


                    <!-- YES -->

                    <label class="radio-option">

                        <input
                            type="radio"
                            name="service_satisfied"
                            value="Yes"
                            required
                        >

                        <span class="radio-custom"></span>

                        <span>Yes</span>

                    </label>


                    <!-- NO -->

                    <label class="radio-option">

                        <input
                            type="radio"
                            name="service_satisfied"
                            value="No"
                        >

                        <span class="radio-custom"></span>

                        <span>No</span>

                    </label>


                </div>

            </div>


            <!-- =================================================
                 SUBMIT
            ================================================== -->

            <div class="form-footer">

                <button
                    type="submit"
                    class="submit-btn"
                >

                    <i class="bi bi-send-check"></i>

                    Submit Feedback

                </button>

            </div>


        </form>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="page-footer">

        <i class="bi bi-shield-check"></i>

        Customer feedback is recorded securely.

    </div>


</div>


<!-- =========================================================
     SUCCESS POPUP
========================================================== -->

{% if popup_message %}

<script>

    alert("{{ popup_message }}");

</script>

{% endif %}


</body>

</html>
